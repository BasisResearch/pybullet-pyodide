name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build_wheel:
    name: Build (py${{ matrix.python }}, pyodide ${{ matrix.pyodide-runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            pyodide-build: "0.34.3"
            pyodide-runtime: "0.29.4"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install pyodide toolchain
        # --with pip is necessary for strange reasons
        run: uv tool install pyodide-cli --with 'pyodide-build==${{ matrix.pyodide-build }}' --with pip

      - name: Install xbuildenv
        run: |
          pyodide xbuildenv install ${{ matrix.pyodide-runtime }}
          pyodide xbuildenv install-emscripten

      - name: Build recipe
        run: |
          source "$(pyodide config get emsdk_dir)/emsdk_env.sh"
          pyodide build-recipes-no-deps pybullet --recipe-dir packages

      - uses: actions/upload-artifact@v4
        with:
          name: pybullet-wheel-py${{ matrix.python }}-pyodide${{ matrix.pyodide-runtime }}
          path: packages/pybullet/dist/*.whl
          if-no-files-found: error

  smoke_test:
    name: Smoke test (pyodide ${{ matrix.pyodide-runtime }})
    needs: build_wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            pyodide-runtime: "0.29.4"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: pybullet-wheel-py${{ matrix.python }}-pyodide${{ matrix.pyodide-runtime }}
          path: packages/pybullet/dist

      - name: Run smoke test
        working-directory: test
        run: |
          npm install
          node smoke.mjs

  release:
    name: Attach wheel to GitHub release
    if: github.ref_type == 'tag'
    needs: [build_wheel, smoke_test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pybullet-wheel-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
